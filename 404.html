<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>

<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: rgb(22, 24, 28);
    --panel: rgb(40, 41, 46);
    --border: #2e2e3b;
    --text: #e7e7ee;
    --muted: #a0a0b2;
    --blue: #0e87f9;
    --blue-2: #0e7de4;
    --radius: 14px;
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  a { color: #8bc7ff; text-decoration: none; }

  /* ── Main layout ── */
  .error-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    position: relative;
    z-index: 1;
  }

  .error-content {
    text-align: center;
    max-width: 580px;
  }

  /* ── Animated 404 ── */
  .error-code-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 16px;
  }

  .error-code-wrap::after {
    content: '404';
    position: absolute;
    inset: 0;
    font-size: 120px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, var(--blue), var(--blue-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: blur(26px) opacity(0.5);
    animation: glowPulse 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes glowPulse {
    0%, 100% { filter: blur(26px) opacity(0.38); }
    50%       { filter: blur(38px) opacity(0.65); }
  }

  .error-code {
    font-size: 120px;
    font-weight: 800;
    line-height: 1;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .error-code .d {
    display: inline-block;
    background: linear-gradient(160deg, #5db8ff 0%, var(--blue) 45%, var(--blue-2) 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: digitBounce 2.6s ease-in-out infinite, gradientShift 4s ease infinite;
  }
  .error-code .d:nth-child(1) { animation-delay: 0s,    0s; }
  .error-code .d:nth-child(2) { animation-delay: 0.13s, 0.5s; }
  .error-code .d:nth-child(3) { animation-delay: 0.26s, 1s; }

  @keyframes digitBounce {
    0%, 100% { transform: translateY(0px)  scaleY(1); }
    40%       { transform: translateY(-18px) scaleY(1.04); }
    55%       { transform: translateY(5px)   scaleY(0.97); }
    70%       { transform: translateY(-7px)  scaleY(1.01); }
    85%       { transform: translateY(2px)   scaleY(0.99); }
  }

  @keyframes gradientShift {
    0%   { background-position: 0%   50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0%   50%; }
  }

  .error-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text);
  }

  .error-message {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 32px;
    line-height: 1.6;
    min-height: 52px;
    opacity: 1;
    transition: opacity 0.3s ease;
  }

  .error-message.fade-out { opacity: 0; }

  .error-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 14px 32px;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    border: none;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-2); transform: translateY(-2px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: rgba(14, 135, 249, 0.1);
    border-color: var(--blue);
    color: var(--blue);
  }
  .btn-secondary:active { transform: scale(0.98); }

  /* ── Footer ── */
  .footer {
    position: relative;
    z-index: 1;
    padding: 40px 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    text-align: center;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; width: 100%; }

  .footer-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .footer-links a {
    color: var(--muted);
    font-size: 24px;
    transition: color 0.2s, transform 0.2s, filter 0.2s;
  }

  .footer-links a:hover {
    color: var(--blue);
    transform: translateY(-3px);
    filter: drop-shadow(0 0 10px var(--blue-2));
  }

  .footer-links a i {
    font-size: 24px;
    display: inline-block;
    transition: color 0.2s, transform 0.2s, filter 0.2s;
  }

  .footer-content p { margin: 4px 0; font-size: 14px; }

  /* Custom Cursors */
  * { cursor: url('cursors/customcursor.png'), auto; }
  a, button, [role="button"] { cursor: url('cursors/customcursor_hand_grab.png'), grab; }

  /* Mobile */
  @media (max-width: 768px) {
    .error-code, .error-code-wrap::after { font-size: 80px; }
    .error-title { font-size: 24px; }
    .error-message { font-size: 15px; }
    .error-actions { flex-direction: column; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<main class="error-container">
  <div class="error-content">
    <div class="error-code-wrap">
      <div class="error-code" aria-label="404">
        <span class="d">4</span><span class="d">0</span><span class="d">4</span>
      </div>
    </div>
    <h2 class="error-title">Page Not Found</h2>
    <p class="error-message" id="error-message"></p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">
        <span>↖</span> Return Home
      </a>
      <a href="/discord" class="btn btn-secondary">
        Join Discord
      </a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-links">
      <a href="/discord/" target="_blank" title="Discord"><i class="bi bi-discord"></i></a>
      <a href="https://x.com/DenjisWorkspace" target="_blank" title="X (Twitter)"><i class="bi bi-twitter-x"></i></a>
    </div>
    <div class="footer-content">
      <p>Developed by TheCrackersStudio</p>
      <p>Built for the Minecraft Community.</p>
    </div>
  </div>
</footer>

<script>
/* ─────────────────────────────────────────
   Randomized messages
───────────────────────────────────────── */
(function () {
  const messages = [
    "Looks like you've ventured into uncharted territory. The page you're looking for doesn't exist or has been moved.",
    "You must've taken a wrong turn somewhere. This page doesn't exist — but our homepage does!",
    "This chunk hasn't loaded yet... and it never will. The page you're after is gone.",
    "A creeper exploded the page. Nothing left but a crater — head back home.",
    "You've dug too deep. There's nothing here, not even bedrock.",
    "This page is as lost as your items after a lava death. Gone forever.",
    "Respawn point not set. The page you're looking for has despawned.",
    "Looks like this page fell into the void. We can't get it back.",
    "That URL doesn't exist in any dimension we know of. Try heading home.",
    "Even with a map, you wouldn't find this page. It simply doesn't exist.",
    "This route leads nowhere — kinda like a mineshaft with no ore.",
    "Herobrine took it. This page is just... gone.",
    "Inventory full. The page you wanted couldn't be picked up.",
    "This page is in another biome. Definitely not here.",
    "You found a rare structure: an empty void with nothing inside.",
  ];

  const el = document.getElementById('error-message');
  let lastIndex = -1;

  function showNext() {
    let next;
    do { next = Math.floor(Math.random() * messages.length); } while (next === lastIndex);
    lastIndex = next;
    el.classList.add('fade-out');
    setTimeout(() => {
      el.textContent = messages[lastIndex];
      el.classList.remove('fade-out');
    }, 300);
  }

  showNext();
  setInterval(showNext, 5000);
})();
</script>

</body>
</html>
