<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue1: #00d4ff;
    --blue2: #0057ff;
    --dark: #000000;
  }

  body {
    background: var(--dark);
    color: var(--blue1);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 20, 0.3) 2px,
      rgba(0, 0, 20, 0.3) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Glitch noise overlay */
  .noise {
    position: fixed;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    animation: noiseAnim 0.3s steps(1) infinite;
  }

  @keyframes noiseAnim {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-2px, 1px); }
    50%  { transform: translate(1px, -2px); }
    75%  { transform: translate(-1px, 2px); }
    100% { transform: translate(2px, -1px); }
  }

  /* Center content */
  .center {
    position: relative;
    z-index: 100;
    text-align: center;
    transform-style: preserve-3d;
  }

  /* Giant 404 */
  .glitch-404 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(100px, 22vw, 260px);
    font-weight: 900;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px var(--blue1);
    position: relative;
    letter-spacing: -0.02em;
    text-shadow: 0 0 40px rgba(0,212,255,0.3);
    animation: glitch404 3s infinite;
  }

  .glitch-404::before,
  .glitch-404::after {
    content: '404';
    position: absolute;
    inset: 0;
    -webkit-text-stroke: 2px;
  }

  .glitch-404::before {
    -webkit-text-stroke-color: #ff003c;
    animation: glitchBefore 3s infinite;
    clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
  }

  .glitch-404::after {
    -webkit-text-stroke-color: var(--blue2);
    animation: glitchAfter 3s infinite;
    clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
  }

  @keyframes glitch404 {
    0%, 90%, 100% { transform: translate(0); }
    91% { transform: translate(-3px, 1px); }
    93% { transform: translate(3px, -1px); }
    95% { transform: translate(-2px, 2px); }
    97% { transform: translate(2px, -2px); }
  }

  @keyframes glitchBefore {
    0%, 90%, 100% { transform: translate(0); opacity: 0; }
    91% { transform: translate(-6px, 0); opacity: 1; }
    93% { transform: translate(6px, 0); opacity: 1; }
    95% { transform: translate(-4px, 0); opacity: 1; }
    97% { transform: translate(0); opacity: 0; }
  }

  @keyframes glitchAfter {
    0%, 90%, 100% { transform: translate(0); opacity: 0; }
    91% { transform: translate(6px, 0); opacity: 1; }
    93% { transform: translate(-6px, 0); opacity: 1; }
    95% { transform: translate(4px, 0); opacity: 1; }
    97% { transform: translate(0); opacity: 0; }
  }

  .subtitle {
    font-size: clamp(12px, 2vw, 18px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(0,212,255,0.6);
    margin-top: -10px;
    margin-bottom: 20px;
    transition: opacity 0.2s;
    animation: blink 4s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49%, 51%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Error log box */
  .error-log {
    font-size: clamp(10px, 1.3vw, 13px);
    color: rgba(0,212,255,0.45);
    letter-spacing: 0.1em;
    margin-bottom: 36px;
    line-height: 1.9;
    border: 1px solid rgba(0,212,255,0.12);
    padding: 14px 20px;
    text-align: left;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
    position: relative;
  }

  .error-log::before {
    content: '// ERROR LOG';
    position: absolute;
    top: -10px;
    left: 12px;
    background: var(--dark);
    padding: 0 6px;
    font-size: 10px;
    color: rgba(0,212,255,0.3);
    letter-spacing: 0.2em;
  }

  .error-line {
    display: block;
    transition: opacity 0.3s, color 0.3s;
  }

  .error-line.dim { opacity: 0.15; }

  @keyframes flashRed {
    0%, 100% { color: rgba(0,212,255,0.45); }
    40% { color: #ff003c; }
  }

  .error-line.flash { animation: flashRed 0.5s ease; }

  .btn {
    display: inline-block;
    padding: 12px 36px;
    border: 1px solid var(--blue1);
    color: var(--blue1);
    text-decoration: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: color 0.3s;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--blue1);
    transform: translateX(-100%);
    transition: transform 0.3s ease;
  }

  .btn:hover::before { transform: translateX(0); }
  .btn:hover { color: var(--dark); }
  .btn span { position: relative; z-index: 1; }

  /* Mouse glow ripple */
  .ripple {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(0, 212, 255, 0.3);
    pointer-events: none;
    z-index: 5;
    animation: rippleOut 1s ease-out forwards;
  }

  @keyframes rippleOut {
    from { width: 0; height: 0; opacity: 0.8; transform: translate(-50%, -50%); }
    to   { width: 200px; height: 200px; opacity: 0; transform: translate(-50%, -50%); }
  }




</style>
</head>
<body>

<div class="scanlines"></div>
<div class="noise"></div>

<div class="center" id="center">
  <div class="glitch-404">404</div>
  <div class="subtitle" id="subtitle">Signal Lost</div>

  <div class="error-log">
    <span class="error-line" id="line1"></span>
    <span class="error-line" id="line2"></span>
    <span class="error-line" id="line3"></span>
  </div>

  <a href="https://javanstuff.ir" class="btn"><span>Return to base</span></a>
</div>

<script>
  // Click ripple
  document.addEventListener('click', e => {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = e.clientX + 'px';
    r.style.top = e.clientY + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 1000);
  });



  // Randomized error content
  const subtitles = [
    'Signal Lost', 'Connection Severed', 'Reality Fragmented',
    'Sector Corrupted', 'Null Pointer Detected', 'Void Encountered',
    'Route Dissolved', 'System Destabilized'
  ];

  const errorMessages = [
    ['ERR_ROUTE_NOT_FOUND: 0x00000404', 'stack trace corrupted — unrecoverable', 'attempting recovery... [FAILED]'],
    ['SEGFAULT at address 0xDEADBEEF', 'page table entry is missing', 'kernel panic — not syncing'],
    ['HTTP 404: resource has evaporated', 'dns lookup returned void', 'universe.get(page) → null'],
    ['FATAL: path dissolved in transit', 'checksum mismatch on existence', 'rollback sequence impossible'],
    ['ERR_EXISTENCE_UNDEFINED at runtime', 'memory address 0x404 unreachable', 'signal 9: terminated by void'],
    ['WARN: timeline divergence detected', 'requested node never existed', 'entropy level: critical'],
    ['ACCESS DENIED: location unknown', 'spatial index out of bounds', 'coordinates lost in noise floor'],
    ['CORRUPT: inode 0x0000404', 'filesystem integrity check: 0%', 'fsck terminated abnormally'],
    ['TypeError: page is not a function', 'prototype chain leads to null', 'call stack trace: [empty]'],
    ['404: you wandered too far', 'beacon signal unresponsive', 'rescue operation: pending...'],
  ];

  const line1 = document.getElementById('line1');
  const line2 = document.getElementById('line2');
  const line3 = document.getElementById('line3');
  const subtitleEl = document.getElementById('subtitle');

  function setRandomError() {
    const msgs = errorMessages[Math.floor(Math.random() * errorMessages.length)];
    const sub = subtitles[Math.floor(Math.random() * subtitles.length)];

    // Fade subtitle
    subtitleEl.style.opacity = 0;
    setTimeout(() => {
      subtitleEl.textContent = sub;
      subtitleEl.style.opacity = 1;
    }, 200);

    // Cycle lines with stagger
    [line1, line2, line3].forEach((el, i) => {
      el.classList.remove('flash');
      el.classList.add('dim');
      setTimeout(() => {
        el.textContent = '> ' + msgs[i];
        el.classList.remove('dim');
        if (Math.random() > 0.55) {
          void el.offsetWidth; // force reflow to restart animation
          el.classList.add('flash');
        }
      }, 180 + i * 140);
    });
  }

  setRandomError();
  setInterval(setRandomError, 3500);
</script>
</body>
</html>
