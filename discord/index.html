    <style>
        body {
            margin: 0;
            background: #313338;
            color: #dbdee1;
            /* Discord's exact font stack */
            font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: grid;
            place-items: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            text-align: center;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #5865f2;
            border-radius: 50%;
            animation: rotate 0.7s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        p {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 8px;
        }

        a {
            color: #00a8fc;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.8;
        }

        a:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="wrap">
        <p style="font-size: 1.5rem; font-weight: 700; margin-bottom: 14px;">Java & Stuff Discord Discontinued</p>
        <p style="opacity: 0.92; margin-bottom: 18px; max-width: 480px;">The Discord invite is no longer active. We have discontinued the Discord community as part of ending development for Java & Stuff.</p>
        <p style="opacity: 0.8; margin-bottom: 24px; max-width: 480px;">The website remains online and you can still download the files from the main page.</p>
