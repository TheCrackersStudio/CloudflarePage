<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Successful - Java & Stuff</title>
    
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="shortcut icon" href="../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <link rel="manifest" href="../site.webmanifest" />
    
    <style>
        /* Custom Cursors */
        * {
          cursor: url('../cursors/customcursor.png'), auto;
        }
        a, button, [role="button"], input[type="submit"], input[type="button"], [onclick], .clickable {
          cursor: url('../cursors/customcursor_hand_grab.png'), grab;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 20px;
            box-sizing: border-box;
            text-align: center;
            padding-top: 40px;
        }

        .container {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            max-width: 500px;
            width: 100%;
        }

        .success-icon {
            font-size: 4em;
            color: #4CAF50;
            margin-bottom: 20px;
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: var(--blue);
            margin-bottom: 10px;
            font-size: 2em;
            font-weight: 700;
        }

        .subtitle {
            color: #4CAF50;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        p {
            font-size: 1em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--text);
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .btn-primary, .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.2s ease;
            border: none;
            cursor: grab;
        }

        .btn-primary {
            background-color: var(--blue);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--blue-2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 135, 249, 0.3);
        }

        .btn-secondary {
            background-color: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
            transform: translateY(-2px);
        }

        .confirmation-details {
            background-color: rgba(76, 175, 80, 0.1);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            color: var(--text);
            font-size: 0.95em;
        }

        .confirmation-details i {
            color: #4CAF50;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verification Successful!</h1>
        <p class="subtitle">Your Discord account has been linked.</p>
        
        <div class="confirmation-details">
            <i class="bi bi-shield-check"></i>
            <span>You now have access to exclusive Java & Stuff server features.</span>
        </div>

        <p>You can now enjoy all the premium features and benefits in our Discord community. Welcome aboard!</p>

        <div class="button-group">
            <a href="https://discord.gg/your-discord-link" class="btn-primary" target="_blank">
                <i class="bi bi-discord"></i>
                Join Our Discord
            </a>
            <a href="/" class="btn-secondary">
                <i class="bi bi-house"></i>
                Back to Home
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Context menu handling
            const contextMenu = document.getElementById('context-menu');
            
            if (contextMenu) {
              function showContextMenu(e) {
                e.preventDefault();
                e.stopPropagation();
                
                contextMenu.classList.remove('hide');
                contextMenu.style.display = 'block';
                
                contextMenu.style.position = 'fixed';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
                
                contextMenu.classList.add('show');
                
                setTimeout(function() {
                  const rect = contextMenu.getBoundingClientRect();
                  if (rect.right > window.innerWidth) {
                    contextMenu.style.left = (e.pageX - rect.width) + 'px';
                  }
                  if (rect.bottom > window.innerHeight) {
                    contextMenu.style.top = (e.pageY - rect.height) + 'px';
                  }
                }, 0);
              }
              
              function hideContextMenu() {
                contextMenu.classList.remove('show');
                contextMenu.classList.add('hide');
                
                setTimeout(function() {
                  contextMenu.classList.remove('hide');
                  contextMenu.style.display = 'none';
                }, 200);
              }
              
              window.addEventListener('contextmenu', showContextMenu, false);
              
              window.addEventListener('click', function(e) {
                if (contextMenu.classList.contains('show') && e.target.closest('.context-menu') === null) {
                  hideContextMenu();
                }
              }, false);
              
              window.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && contextMenu.classList.contains('show')) {
                  hideContextMenu();
                }
              });
              
              contextMenu.addEventListener('click', function(e) {
                e.preventDefault();
                const button = e.target.closest('.context-menu-item');
                if (!button) return;
                
                const action = button.getAttribute('data-action');
                
                switch(action) {
                  case 'back':
                    window.history.back();
                    break;
                  case 'forward':
                    window.history.forward();
                    break;
                  case 'reload':
                    window.location.reload();
                    break;
                  case 'nav-home':
                    window.location.href = '/';
                    break;
                  case 'nav-discord':
                    window.location.href = '/discord/';
                    break;
                  case 'nav-download':
                    window.location.href = '/download/';
                    break;
                  case 'nav-faq':
                    window.location.href = '/FAQ/';
                    break;
                }
                
                hideContextMenu();
              });
            }
        });
    </script>

    <!-- Custom Context Menu -->
    <div id="context-menu" class="context-menu" role="menu" aria-hidden="true">
      <button class="context-menu-item" data-action="back" aria-label="Back">
        <i class="bi bi-arrow-left"></i>
        <span>Back</span>
      </button>
      <button class="context-menu-item" data-action="forward" aria-label="Forward">
        <i class="bi bi-arrow-right"></i>
        <span>Forward</span>
      </button>
      <button class="context-menu-item" data-action="reload" aria-label="Reload">
        <i class="bi bi-arrow-clockwise"></i>
        <span>Reload</span>
      </button>
      <hr class="context-menu-divider">
      <button class="context-menu-item" data-action="nav-home" aria-label="Home">
        <i class="bi bi-house"></i>
        <span>Home</span>
      </button>
      <button class="context-menu-item" data-action="nav-discord" aria-label="Discord">
        <i class="bi bi-discord"></i>
        <span>Discord</span>
      </button>
      <button class="context-menu-item" data-action="nav-download" aria-label="Download">
        <i class="bi bi-download"></i>
        <span>Download</span>
      </button>
      <button class="context-menu-item" data-action="nav-faq" aria-label="FAQ">
        <i class="bi bi-question-circle"></i>
        <span>FAQ</span>
      </button>
    </div>
</body>
</html>
