<!DOCTYPE html>

    <style>
        /* Unified site theme (verify/success/already-verified) */
        * {
            cursor: url('../cursors/customcursor.png'), auto;
        }

        a, button, [role="button"], .verify-button, .btn-primary, .btn-secondary, input[type="submit"], input[type="button"], [onclick], .clickable {
            cursor: url('../cursors/customcursor_hand_grab.png'), grab;
        }

        input, textarea {
            cursor: url('../cursors/customcursor_beam.png'), text;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            background: radial-gradient(circle at top, #272b31 0%, #181a1f 100%);
        }

        .container {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
            max-width: 540px;
            width: 100%;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .container:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 55px rgba(0,0,0,0.45);
        }

        h1 {
            color: var(--blue);
            margin-bottom: 12px;
            font-size: 2.1rem;
            font-weight: 800;
        }

        .subtitle {
            color: #4caf50;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 22px;
            color: var(--text);
        }

        .btn-primary, .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--blue);
            color: #ffffff;
            border-color: transparent;
        }

        .btn-primary:hover {
            background-color: var(--blue-2);
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(14,135,249,0.35);
        }

        .btn-secondary {
            background-color: var(--panel-2);
            color: var(--text);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
            transform: translateY(-1px);
        }

        .confirmation-details {
            background-color: rgba(14,135,249,0.08);
            border-left: 4px solid var(--blue);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin: 0 auto 18px;
            text-align: left;
            max-width: 450px;
            color: var(--text);
            font-size: 0.95rem;
        }

        .confirmation-details i {
            margin-right: 8px;
            color: var(--blue);
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verification Successful!</h1>
        <p class="subtitle">Your Discord account has been linked.</p>
        
        <div class="confirmation-details">
            <i class="bi bi-shield-check"></i>
            <span>You now have access to exclusive Java & Stuff server features.</span>
        </div>

        <p>You can now enjoy all the premium features and benefits in our Discord community. Welcome aboard!</p>

        <div class="button-group">
            <a href="https://discord.gg/your-discord-link" class="btn-primary" target="_blank">
                <i class="bi bi-discord"></i>
                Join Our Discord
            </a>
            <a href="/" class="btn-secondary">
                <i class="bi bi-house"></i>
                Back to Home
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Redirect to verify if accessed directly (not from verify page)
            const referrer = document.referrer;
            if (!referrer || !referrer.includes('/verify')) {
                window.location.href = '/verify';
                return;
            }

            // Context menu handling
            const contextMenu = document.getElementById('context-menu');
            
            if (contextMenu) {
              function showContextMenu(e) {
                e.preventDefault();
                e.stopPropagation();
                
                contextMenu.classList.remove('hide');
                contextMenu.style.display = 'block';
                
                contextMenu.style.position = 'fixed';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
                
                contextMenu.classList.add('show');
                
                setTimeout(function() {
                  const rect = contextMenu.getBoundingClientRect();
                  if (rect.right > window.innerWidth) {
                    contextMenu.style.left = (e.pageX - rect.width) + 'px';
                  }
                  if (rect.bottom > window.innerHeight) {
                    contextMenu.style.top = (e.pageY - rect.height) + 'px';
                  }
                }, 0);
              }
              
              function hideContextMenu() {
                contextMenu.classList.remove('show');
                contextMenu.classList.add('hide');
                
                setTimeout(function() {
                  contextMenu.classList.remove('hide');
                  contextMenu.style.display = 'none';
                }, 200);
              }
              
              window.addEventListener('contextmenu', showContextMenu, false);
              
              window.addEventListener('click', function(e) {
                if (contextMenu.classList.contains('show') && e.target.closest('.context-menu') === null) {
                  hideContextMenu();
                }
              }, false);
              
              window.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && contextMenu.classList.contains('show')) {
                  hideContextMenu();
                }
              });
              
              contextMenu.addEventListener('click', function(e) {
                e.preventDefault();
                const button = e.target.closest('.context-menu-item');
                if (!button) return;
                
                const action = button.getAttribute('data-action');
                
                switch(action) {
                  case 'back':
                    window.history.back();
                    break;
                  case 'forward':
                    window.history.forward();
                    break;
                  case 'reload':
                    window.location.reload();
                    break;
                  case 'nav-home':
                    window.location.href = '/';
                    break;
                  case 'nav-discord':
                    window.location.href = '/discord/';
                    break;
                  case 'nav-download':
                    window.location.href = '/download/';
                    break;
                  case 'nav-faq':
                    window.location.href = '/FAQ/';
                    break;
                }
                
                hideContextMenu();
              });
            }
        });
    </script>

    <!-- Custom Context Menu -->
    <div id="context-menu" class="context-menu" role="menu" aria-hidden="true">
      <button class="context-menu-item" data-action="back" aria-label="Back">
        <i class="bi bi-arrow-left"></i>
        <span>Back</span>
      </button>
      <button class="context-menu-item" data-action="forward" aria-label="Forward">
        <i class="bi bi-arrow-right"></i>
        <span>Forward</span>
      </button>
      <button class="context-menu-item" data-action="reload" aria-label="Reload">
        <i class="bi bi-arrow-clockwise"></i>
        <span>Reload</span>
      </button>
      <hr class="context-menu-divider">
      <button class="context-menu-item" data-action="nav-home" aria-label="Home">
        <i class="bi bi-house"></i>
        <span>Home</span>
      </button>
      <button class="context-menu-item" data-action="nav-discord" aria-label="Discord">
        <i class="bi bi-discord"></i>
        <span>Discord</span>
      </button>
      <button class="context-menu-item" data-action="nav-download" aria-label="Download">
        <i class="bi bi-download"></i>
        <span>Download</span>
      </button>
      <button class="context-menu-item" data-action="nav-faq" aria-label="FAQ">
        <i class="bi bi-question-circle"></i>
        <span>FAQ</span>
      </button>
    </div>
</body>
</html>
