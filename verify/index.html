<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification - Java & Stuff</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2f33; /* Dark Discord-like background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .container {
            background-color: #36393f; /* Slightly lighter Discord-like panel */
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #7289da; /* Discord blue */
            margin-bottom: 20px;
            font-size: 2em;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .verify-button {
            display: inline-block;
            background-color: #7289da; /* Discord blue */
            color: #ffffff;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .verify-button:hover {
            background-color: #677bc4; /* Darker Discord blue on hover */
        }

        .loader {
            border: 4px solid #f3f3f3; /* Light grey */
            border-top: 4px solid #7289da; /* Discord blue */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none; /* Hidden by default */
            margin: 20px auto 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Message styles for success/error */
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            display: none; /* Hidden by default */
        }

        .message.success {
            background-color: #4CAF50; /* Green */
            color: white;
        }

        .message.error {
            background-color: #f44336; /* Red */
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Discord Verification</h1>
        <p>
            Click the button below to link your Discord account with Java & Stuff. 
            This will grant you access to exclusive server features.
        </p>
        <a id="verifyLink" href="YOUR_DISCORD_AUTH_URL_HERE" class="verify-button">
            Verify with Discord
        </a>
        <div id="loading" class="loader"></div>
        <p id="responseMessage" class="message"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const verifyLink = document.getElementById('verifyLink');
            const loadingSpinner = document.getElementById('loading');
            const responseMessage = document.getElementById('responseMessage');

            // Replace YOUR_CLIENT_ID and ensure redirect_uri is URL-encoded
            // Example: https%3A%2F%2Fjavanstuff.ir%2Fverify
            const discordAuthUrl = "https://discord.com/api/oauth2/authorize?" +
                                   "client_id=1473350061344952330&" +
                                   "redirect_uri=https%3A%2F%2Fjavanstuff.ir%2Fverify&" +
                                   "response_type=code&" +
                                   "scope=identify+guilds.join";
            verifyLink.href = discordAuthUrl;

            // Optional: Show loading spinner if user clicks the button
            verifyLink.addEventListener('click', () => {
                verifyLink.style.display = 'none'; // Hide button
                loadingSpinner.style.display = 'block'; // Show spinner
                responseMessage.style.display = 'none'; // Clear any previous messages
            });

            // Handle messages from the Cloudflare Worker's response (if it returns HTML)
            // This part is more complex if the worker directly returns a success/error message
            // which replaces the page. For a simple success/error page from the worker,
            // this JS on the *initial* page is less relevant after redirection.
            // If the worker sends a redirect back, the behavior changes.
        });
    </script>
</body>
</html>
