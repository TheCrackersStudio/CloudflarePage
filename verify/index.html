<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="Minecraft, Discord Verification, Java & Stuff, Community">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="TheCrackersStudio">
    
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="shortcut icon" href="../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <link rel="manifest" href="../site.webmanifest" />

    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#fcfc37">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Discord Verification - Java & Stuff">
    <meta property="og:description" content="Verify your Discord account to access Java & Stuff exclusive features.">
    <meta property="og:url" content="https://www.javanstuff.ir/verify/">
    <meta property="og:image" content="https://www.javanstuff.ir/discordembed.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Discord Verification - Java & Stuff">
    <meta name="twitter:description" content="Verify your Discord account to access exclusive features.">
    <meta name="twitter:image" content="https://www.javanstuff.ir/discordembed.png">
    
    <style>
        /* Custom Cursors */
        * {
          cursor: url('../cursors/customcursor.png'), auto;
        }
        a, button, [role="button"], .verify-button, input[type="submit"], input[type="button"], [onclick], .clickable {
          cursor: url('../cursors/customcursor_hand_grab.png'), grab;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .container {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: var(--blue);
            margin-bottom: 20px;
            font-size: 2em;
            font-weight: 700;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--text);
        }

        .verify-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--blue);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.2s ease;
            border: none;
            cursor: grab;
        }

        .verify-button:hover {
            background-color: var(--blue-2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 135, 249, 0.3);
        }

        .verify-button:active {
            transform: translateY(0);
        }

        .loader {
            border: 4px solid var(--border);
            border-top: 4px solid var(--blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
            border: 1px solid var(--border);
        }

        .message.success {
            background-color: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
            border-color: #4CAF50;
        }

        .message.error {
            background-color: rgba(244, 67, 54, 0.1);
            color: #f44336;
            border-color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="bi bi-discord"></i> Discord Verification</h1>
        <p>
            Click the button below to link your Discord account with Java & Stuff. 
            This will grant you access to exclusive server features.
        </p>
        <a id="verifyLink" href="YOUR_DISCORD_AUTH_URL_HERE" class="verify-button">
            <i class="bi bi-check-circle"></i>
            Verify with Discord
        </a>
        <div id="loading" class="loader"></div>
        <p id="responseMessage" class="message"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const verifyLink = document.getElementById('verifyLink');
            const loadingSpinner = document.getElementById('loading');
            const responseMessage = document.getElementById('responseMessage');

            const discordAuthUrl = "https://discord.com/api/oauth2/authorize?" +
                                   "client_id=1473350061344952330&" +
                                   "redirect_uri=https%3A%2F%2Fjavanstuff.ir%2Fverify&" +
                                   "response_type=code&" +
                                   "scope=identify+guilds.join";
            verifyLink.href = discordAuthUrl;

            verifyLink.addEventListener('click', () => {
                verifyLink.style.display = 'none';
                loadingSpinner.style.display = 'block';
                responseMessage.style.display = 'none';
            });

            // Context menu handling
            const contextMenu = document.getElementById('context-menu');
            
            if (contextMenu) {
              function showContextMenu(e) {
                e.preventDefault();
                e.stopPropagation();
                
                contextMenu.classList.remove('hide');
                contextMenu.style.display = 'block';
                
                contextMenu.style.position = 'fixed';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
                
                contextMenu.classList.add('show');
                
                setTimeout(function() {
                  const rect = contextMenu.getBoundingClientRect();
                  if (rect.right > window.innerWidth) {
                    contextMenu.style.left = (e.pageX - rect.width) + 'px';
                  }
                  if (rect.bottom > window.innerHeight) {
                    contextMenu.style.top = (e.pageY - rect.height) + 'px';
                  }
                }, 0);
              }
              
              function hideContextMenu() {
                contextMenu.classList.remove('show');
                contextMenu.classList.add('hide');
                
                setTimeout(function() {
                  contextMenu.classList.remove('hide');
                  contextMenu.style.display = 'none';
                }, 200);
              }
              
              window.addEventListener('contextmenu', showContextMenu, false);
              
              window.addEventListener('click', function(e) {
                if (contextMenu.classList.contains('show') && e.target.closest('.context-menu') === null) {
                  hideContextMenu();
                }
              }, false);
              
              window.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && contextMenu.classList.contains('show')) {
                  hideContextMenu();
                }
              });
              
              contextMenu.addEventListener('click', function(e) {
                e.preventDefault();
                const button = e.target.closest('.context-menu-item');
                if (!button) return;
                
                const action = button.getAttribute('data-action');
                
                switch(action) {
                  case 'back':
                    window.history.back();
                    break;
                  case 'forward':
                    window.history.forward();
                    break;
                  case 'reload':
                    window.location.reload();
                    break;
                  case 'nav-home':
                    window.location.href = '/';
                    break;
                  case 'nav-discord':
                    window.location.href = '/discord/';
                    break;
                  case 'nav-download':
                    window.location.href = '/download/';
                    break;
                  case 'nav-faq':
                    window.location.href = '/FAQ/';
                    break;
                }
                
                hideContextMenu();
              });
            }
        });
    </script>

    <!-- Custom Context Menu -->
    <div id="context-menu" class="context-menu" role="menu" aria-hidden="true">
      <button class="context-menu-item" data-action="back" aria-label="Back">
        <i class="bi bi-arrow-left"></i>
        <span>Back</span>
      </button>
      <button class="context-menu-item" data-action="forward" aria-label="Forward">
        <i class="bi bi-arrow-right"></i>
        <span>Forward</span>
      </button>
      <button class="context-menu-item" data-action="reload" aria-label="Reload">
        <i class="bi bi-arrow-clockwise"></i>
        <span>Reload</span>
      </button>
      <hr class="context-menu-divider">
      <button class="context-menu-item" data-action="nav-home" aria-label="Home">
        <i class="bi bi-house"></i>
        <span>Home</span>
      </button>
      <button class="context-menu-item" data-action="nav-discord" aria-label="Discord">
        <i class="bi bi-discord"></i>
        <span>Discord</span>
      </button>
      <button class="context-menu-item" data-action="nav-download" aria-label="Download">
        <i class="bi bi-download"></i>
        <span>Download</span>
      </button>
      <button class="context-menu-item" data-action="nav-faq" aria-label="FAQ">
        <i class="bi bi-question-circle"></i>
        <span>FAQ</span>
      </button>
    </div>
