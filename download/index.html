  <style>
    body { background-color: rgb(22, 24, 28); color: aliceblue; font-family: Inter, system-ui, sans-serif; }
    .dropdown-card { background-color: rgb(40, 41, 46); border: 1px solid #2e2e3b; }
    .bg-blue { background-color: #0e87f9; }
    [x-cloak] { display: none !important; }

    /* Context Menu Styles */
    .context-menu {
      position: fixed;
      display: none;
      background: rgb(40, 41, 46);
      border: 1px solid #2e2e3b;
      border-radius: 12px;
      padding: 8px 0;
      min-width: 180px;
      z-index: 10000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      margin: 0;
      list-style: none;
      opacity: 0;
      pointer-events: none;
    }

    .context-menu.show {
      display: block;
      pointer-events: auto;
      animation: fadeIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .context-menu.hide {
      animation: fadeOut 0.2s ease-out forwards;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.92);
      }
    }

    .context-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      background: none;
      border: none;
      color: #e7e7ee;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s ease;
      text-align: left;
      font-family: inherit;
      user-select: none;
    }

    .context-menu-item:hover {
      background: #16161c;
      color: #0e87f9;
    }

    .context-menu-item:active {
      background: rgba(14, 135, 249, 0.2);
    }

    .context-menu-item i {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .context-menu-divider {
      height: 1px;
      background: #2e2e3b;
      margin: 6px 0;
      border: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

<div class="w-full max-w-sm" x-data="modpackDownloader" x-init="init()" x-cloak>

  <!-- Header -->
  <div class="text-center mb-8">
    <h1 class="text-3xl font-black tracking-tight text-white">Java & Stuff</h1>

    <div class="mt-2">
      <p class="text-xs uppercase tracking-widest text-zinc-500 font-bold">
        Latest Version
      </p>
      <p class="text-lg font-bold text-white">
        <span x-show="!isLoading" x-text="latestVersion ? 'v' + latestVersion : '—'"></span>
        <span x-show="isLoading" class="text-zinc-500">Loading...</span>
      </p>
    </div>
  </div>

  <div class="dropdown-card rounded-2xl shadow-2xl overflow-hidden">

    <!-- Platform Selection -->
    <div class="relative border-b border-zinc-800">
      <button @click="toggle('p')"
              class="w-full p-5 flex justify-between items-center hover:bg-zinc-800/40 transition-all">
        <div class="text-left">
          <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold">
            Platform
          </p>
          <p class="font-bold text-lg"
             :class="selectedPlatform !== 'Select Platform' ? 'text-white' : 'text-zinc-600'"
             x-text="selectedPlatform">
          </p>
        </div>

        <svg class="w-5 h-5 text-zinc-600 transition-transform duration-75 ease-linear"
             :class="open === 'p' ? 'rotate-180' : ''"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M19 9l-7 7-7-7"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>

      <div x-show="open === 'p'" x-collapse>
        <div class="bg-zinc-900/50 text-sm">
          <template x-for="p in platforms" :key="p">
            <div @click="selectPlatform(p)"
                 class="px-5 py-4 hover:bg-blue/10 hover:text-blue-400 cursor-pointer border-t border-zinc-800/50 transition-colors flex items-center justify-between">
              <span class="font-medium" x-text="p"></span>
            </div>
          </template>

          <div x-show="platforms.length === 0"
               class="px-5 py-4 text-zinc-400">
            No platform builds found.
          </div>
        </div>
      </div>
    </div>

    <!-- Download Button -->
    <div class="p-4" style="background-color: rgba(46, 46, 59, 0.3);">
      <button
        @click="triggerDownload"
        :disabled="isDownloading || isLoading || selectedPlatform === 'Select Platform'"
        class="w-full bg-blue hover:brightness-110 active:scale-[0.98] disabled:opacity-50 text-black font-black py-4 rounded-xl transition-all flex items-center justify-center gap-3 shadow-lg shadow-blue-500/20">

        <span class="text-sm uppercase tracking-wider"
              x-text="isDownloading
                      ? 'Processing...'
                      : (latestVersion
                          ? 'Download v' + latestVersion + (selectedPlatform !== 'Select Platform' ? ' (' + selectedPlatform + ')' : '')
                          : 'Download')">
        </span>
      </button>

      <!-- Download Timer Message -->
      <div x-show="downloadCountdown > 0" class="mt-4 p-3 rounded-lg text-center text-sm" style="background-color: rgba(14, 135, 249, 0.1); border: 1px solid rgba(14, 135, 249, 0.3); color: #8bc7ff;">
        <p x-text="`Download will begin in ${downloadCountdown} second${downloadCountdown !== 1 ? 's' : ''}...`"></p>
      </div>

      <!-- Download Started Message -->
      <div x-show="showDownloadMessage && downloadCountdown === 0" class="mt-4 p-3 rounded-lg text-center text-sm" style="background-color: rgba(14, 135, 249, 0.1); border: 1px solid rgba(14, 135, 249, 0.3); color: #8bc7ff;">
        <p>Download started! If it did not begin, click the button below.</p>
      </div>

      <!-- Fallback Download Button -->
      <button x-show="showDownloadMessage && downloadCountdown === 0"
              @click="startDownload()"
              class="w-full mt-3 bg-zinc-700 hover:bg-zinc-600 active:scale-[0.98] text-white font-semibold py-2 rounded-lg transition-all text-sm">
        Click here to download
      </button>

</div>

<script>
const SUPABASE_URL = 'https://tkjicusxvwzpdkxmkumf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRramljdXN4dnd6cGRreG1rdW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwOTU5NTQsImV4cCI6MjA4MjY3MTk1NH0.xCJNeYPmxIrTAkHB2pymv3GLX4e5jwzjGZYbhnOj6GI';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.addEventListener('alpine:init', () => {
  Alpine.data('modpackDownloader', () => ({
    open: null,
    isLoading: true,
    isDownloading: false,
    downloadCountdown: 0,
    showDownloadMessage: false,

    latestVersion: null,
    platforms: [],
    links: {},
    selectedPlatform: 'Select Platform',

    async init() {
      try {
        // Fetch all versions with full data
        const { data, error } = await supabaseClient
          .from('versions')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Supabase error:', error);
          throw error;
        }

        if (!data || data.length === 0) {
          console.warn('No versions found in database');
          this.isLoading = false;
          return;
        }

        console.log('All versions:', data);

        // Get the latest version
        this.latestVersion = data[0].name;
        console.log('Latest version:', this.latestVersion);

        // Build map of platforms to download links for the latest version
        const map = {};
        const list = [];

        data.forEach(row => {
          // Only process versions matching the latest
          if (row.name !== this.latestVersion) return;

          console.log('Processing row:', row);

          // Try to get platform name - handle both single platform and array
          let platformName = null;
          
          if (row.platform && row.platform.trim() !== '') {
            platformName = row.platform;
          } else if (row.platforms && Array.isArray(row.platforms) && row.platforms.length > 0) {
            platformName = row.platforms[0];
          }

          console.log('Platform:', platformName, 'URL:', row.file_url);

          if (platformName && row.file_url) {
            if (!list.includes(platformName)) {
              list.push(platformName);
            }
            map[platformName] = row.file_url;
          }
        });

        console.log('Final platforms:', list);
        console.log('Final links:', map);

        this.links = map;
        this.platforms = list;

      } catch (err) {
        console.error('Error fetching versions:', err);
        alert('Failed to load versions. Check console for details.');
      } finally {
        this.isLoading = false;
      }
    },

    toggle(type) {
      this.open = this.open === type ? null : type;
    },

    selectPlatform(p) {
      this.selectedPlatform = p;
      this.open = null;
    },

    async triggerDownload() {
      if (this.isDownloading) return;

      const url = this.links[this.selectedPlatform];
      if (!url) return;

      // Close dropdown immediately when starting download
      this.open = null;

      this.isDownloading = true;
      this.downloadCountdown = 10;
      this.showDownloadMessage = false;

      try {
        // Update download stats: increment total_downloads and set updated_at
        const { data: currentStats } = await supabaseClient
          .from('download_stats')
          .select('total_downloads')
          .eq('id', 1)
          .single();

        if (currentStats) {
          await supabaseClient
            .from('download_stats')
            .update({
              total_downloads: (currentStats.total_downloads || 0) + 1,
              updated_at: new Date().toISOString()
            })
            .eq('id', 1);
        }
      } catch (err) {
        console.error('Failed to update download stats:', err);
      }

      // Countdown timer
      const countdownInterval = setInterval(() => {
        this.downloadCountdown--;
        if (this.downloadCountdown <= 0) {
          clearInterval(countdownInterval);
          this.startDownload();
        }
      }, 1000);
    },

    async startDownload() {
      const url = this.links[this.selectedPlatform];
      if (!url) return;

      try {
        // Open download URL in a new tab to avoid CORS issues
        window.open(url, '_blank');
      } catch (err) {
        console.error('Download failed:', err);
      }

      this.showDownloadMessage = true;
      this.downloadCountdown = 0;

      // Keep the download state visible until user refreshes/reloads.
      // (No automatic reset.)
    }
  }));
});

// Wait for DOM to be ready before setting up context menu
document.addEventListener('DOMContentLoaded', function() {
  // Global context menu handling
  const contextMenu = document.getElementById('context-menu');
  
  if (!contextMenu) return;
  
  function showContextMenu(e) {
    e.preventDefault();
    e.stopPropagation();
    
    // Reset animation states
    contextMenu.classList.remove('hide');
    contextMenu.style.display = 'block';
    
    contextMenu.style.position = 'fixed';
    contextMenu.style.left = e.pageX + 'px';
    contextMenu.style.top = e.pageY + 'px';
    
    // Trigger fade in animation
    contextMenu.classList.add('show');
    
    // Adjust if off-screen
    setTimeout(function() {
      const rect = contextMenu.getBoundingClientRect();
      if (rect.right > window.innerWidth) {
        contextMenu.style.left = (e.pageX - rect.width) + 'px';
      }
      if (rect.bottom > window.innerHeight) {
        contextMenu.style.top = (e.pageY - rect.height) + 'px';
      }
    }, 0);
  }
  
  function hideContextMenu() {
    contextMenu.classList.remove('show');
    contextMenu.classList.add('hide');
    
    // Remove classes and hide after animation completes
    setTimeout(function() {
      contextMenu.classList.remove('hide');
      contextMenu.style.display = 'none';
    }, 200);
  }
  
  // Show menu on right-click
  window.addEventListener('contextmenu', showContextMenu, false);
  
  // Hide menu on left click or elsewhere
  window.addEventListener('click', function(e) {
    if (contextMenu.classList.contains('show') && e.target.closest('.context-menu') === null) {
      hideContextMenu();
    }
  }, false);
  
  // Hide on Escape
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && contextMenu.classList.contains('show')) {
      hideContextMenu();
    }
  });
  
  // Handle menu item clicks
  contextMenu.addEventListener('click', function(e) {
    e.preventDefault();
    const button = e.target.closest('.context-menu-item');
    if (!button) return;
    
    const action = button.getAttribute('data-action');
    
    switch(action) {
      case 'back':
        window.history.back();
        break;
      case 'forward':
        window.history.forward();
        break;
      case 'reload':
        window.location.reload();
        break;
      case 'nav-home':
        window.location.href = '/';
        break;
      case 'nav-discord':
        window.location.href = '/discord/';
        break;
      case 'nav-faq':
        window.location.href = '/FAQ/';
        break;
    }
    
    hideContextMenu();
  });
});
</script>

</div>
